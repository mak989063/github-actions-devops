name: Simple Action using Composite
run-name: Simple Composite Action-${{ github.run_number }}-${{ github.actor }}
on: [push, workflow_dispatch]

jobs:
    simple-action:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Send a joke on Slack
              uses: ./.github/actions/slack-joke
              id: slack-joke
              with:
                slack_username: ${{ secrets.SLACK_USERNAME }}
                upload_joke: true
                slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
            - name: Display the output joke
              run: echo "${{ steps.slack-joke.outputs.joke }}"
