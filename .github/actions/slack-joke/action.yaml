name: Random Joke
author: Mani
description: A simple action to get a random joke from an API and send it to Slack
inputs:
  slack_username:
    description: 'Slack username to send the joke to'
  upload_joke:
    description: 'Upload joke as an Artifact?'
  slack_webhook:
    description: 'Slack webhook URL to send the joke to'
outputs:
  joke:
    description: 'The random joke fetched from the API'
    value: ${{ steps.joke.outputs.random_joke }}
runs:
  using: composite
  steps:
    - name: Generate Joke
      shell: bash
      id: joke
      run: |
        EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
        echo "random_joke<<$EOF" >> $GITHUB_OUTPUT
        curl -s https://icanhazdadjoke.com/ >> $GITHUB_OUTPUT
        echo "" >> $GITHUB_OUTPUT
        echo "$EOF" >> $GITHUB_OUTPUT
    - name: Generate Joke file
      shell: bash
      run: |
        echo "${{ steps.joke.outputs.random_joke }}" > joke.txt
      if: inputs.upload_joke
    - name: Upload Joke as Artifact
      if: inputs.upload_joke
      uses: actions/upload-artifact@v3
      with:
        name: joke
        path: joke.txt
    - name: Send Joke to Slack
      uses: docker://technosophos/slack-notify-action
      env:
        SLACK_WEBHOOK: ${{ inputs.slack_webhook }}
        SLACK_TITLE: "Random Joke"
        SLACK_COLOR: "#723fc4"
        SLACK_USERNAME: ${{ inputs.slack_username }}
        SLACK_MESSAGE: "${{ inputs.slack_username }} && format('{0}{1}{2}', '@', inputs.slack_username, steps.joke.outputs.random_joke) || steps.joke.outputs.random_joke"
