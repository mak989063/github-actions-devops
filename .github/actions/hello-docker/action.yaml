name: Hello World
author: Mani
description: A simple hello world action
inputs:
  who_to_greet:
    description: 'Who to greet'
    #required: true
    default: 'World'
outputs:
  time:
    description: 'The time of greeting'
runs:
  using: "docker"
  #image: "docker://node:18.16-apine3.17"
  image: "Dockerfile"
  #entrypoint: 
  args: 
    - ${{ inputs.who_to_greet }}
  env:
    HELLO: WORLD
  post-entrypoint: "/cleanup.sh"
  post-if: runner.os == 'Linux'
  pre-entrypoint: "/setup.sh"
  pre-if: runner.os == 'Linux'