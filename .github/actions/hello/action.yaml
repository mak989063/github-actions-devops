name: Hello World
author: Mani
description: A simple hello world action
inputs:
  who_to_greet:
    description: 'Who to greet'
    required: true
    default: 'World'
outputs:
  time:
    description: 'The time of greeting'
runs:
  using: "node16"
  main: "dist/index.js"
  pre: setup.js
  pre-if: runner.os == 'Linux'
  post: cleanup.js
  post-if: runner.os == 'Linux'